@if (variant() === 'disclosure') {
  <details class="disclosure">
    <summary>{{ i18n.t('public.legal.menu') }}</summary>
    <nav [attr.aria-label]="i18n.t('public.legal.menu')">
      <ul class="links">
        @for (link of links(); track link.path) {
          <li>
            <a [routerLink]="link.path" routerLinkActive="current" ariaCurrentWhenActive="page">{{
              link.label
            }}</a>
          </li>
        }
      </ul>
    </nav>
  </details>
} @else {
  <nav [attr.aria-label]="i18n.t('public.legal.menu')">
    <ul class="links">
      @for (link of links(); track link.path) {
        <li>
          <a [routerLink]="link.path" routerLinkActive="current" ariaCurrentWhenActive="page">{{
            link.label
          }}</a>
        </li>
      }
    </ul>
  </nav>
}
