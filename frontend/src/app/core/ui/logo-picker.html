<div class="picker">
  <div class="tile">
    @if (previewUrl(); as preview) {
      <img [src]="preview" [alt]="i18n.t('admin.logo.preview')" />
    } @else if (currentUrl() && !savedBroken()) {
      <img
        [src]="currentUrl()"
        [alt]="
          schoolName()
            ? i18n.t('admin.logo.alt', { name: schoolName() })
            : i18n.t('admin.logo.current')
        "
        (error)="savedBroken.set(true)"
      />
    } @else {
      <sms-icon name="image" [size]="28" />
    }
  </div>

  <div class="side">
    <label
      class="drop"
      [class.dragging]="dragging()"
      [class.disabled]="disabled()"
      (dragover)="onDragOver($event)"
      (dragleave)="dragging.set(false)"
      (drop)="onDrop($event)"
    >
      <input
        class="file"
        type="file"
        accept="image/png,image/jpeg,image/webp"
        [disabled]="disabled()"
        (change)="onInput($event)"
      />
      <sms-icon name="upload" [size]="18" />
      <span>{{
        previewUrl() || currentUrl() ? i18n.t('admin.logo.change') : i18n.t('admin.logo.choose')
      }}</span>
    </label>
    <p class="hint">{{ i18n.t('admin.logo.hint') }}</p>

    @if (fileName(); as name) {
      <p class="chosen">
        <span class="name">{{ name }}</span>
        <button
          type="button"
          class="btn btn-ghost btn-sm"
          [disabled]="disabled()"
          (click)="discard()"
        >
          {{ i18n.t('admin.logo.undo') }}
        </button>
      </p>
    }
    @if (currentUrl() && !previewUrl()) {
      <div>
        <button
          type="button"
          class="btn btn-ghost btn-sm"
          [disabled]="disabled()"
          (click)="removed.emit()"
        >
          {{ i18n.t('admin.logo.remove') }}
        </button>
      </div>
    }
    @if (error(); as message) {
      <p class="field-error" role="alert">{{ message }}</p>
    }
  </div>
</div>
