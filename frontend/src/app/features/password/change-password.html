<main class="gate">
  <section class="card form" aria-labelledby="gate-title">
    <div class="brand">
      <img class="brand-mark" src="brand/logo-mark.svg" alt="" width="48" height="48" />
      <div>
        <h1>Vidyasetu</h1>
        <p>School workspace</p>
      </div>
    </div>

    <div>
      <h2 class="card-title" id="gate-title">Set a new password</h2>
      @if (forced()) {
        <p class="info-note" role="status">
          Your password was set or reset by an administrator. Choose a password of your own to
          continue.
        </p>
      } @else {
        <p class="hint">Choose a new password for your account.</p>
      }
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label class="field">
        Current password
        <input
          class="input"
          type="password"
          formControlName="current_password"
          autocomplete="current-password"
        />
        @if (form.controls.current_password.touched && form.controls.current_password.invalid) {
          <span class="field-error" role="alert">Enter your current password.</span>
        }
      </label>

      <label class="field">
        New password
        <input
          class="input"
          type="password"
          formControlName="new_password"
          autocomplete="new-password"
          aria-describedby="new-password-hint"
        />
        <span class="hint" id="new-password-hint">{{ hint }}</span>
        @if (
          form.controls.new_password.touched && form.controls.new_password.hasError('required')
        ) {
          <span class="field-error" role="alert">Enter a new password.</span>
        } @else if (
          form.controls.new_password.touched && form.controls.new_password.hasError('minlength')
        ) {
          <span class="field-error" role="alert">Use at least {{ minLength }} characters.</span>
        }
        @if (form.controls.new_password.getError('server'); as message) {
          <span class="field-error" role="alert">{{ message }}</span>
        }
      </label>

      <label class="field">
        Confirm new password
        <input
          class="input"
          type="password"
          formControlName="confirm"
          autocomplete="new-password"
        />
        @if (form.controls.confirm.touched && form.hasError('mismatch')) {
          <span class="field-error" role="alert">Passwords do not match.</span>
        }
      </label>

      @if (error(); as message) {
        <p class="form-error" role="alert">{{ message }}</p>
      }

      <button type="submit" class="btn btn-primary" [disabled]="submitting()">
        {{ submitting() ? 'Saving…' : 'Save and continue' }}
      </button>
    </form>

    <button type="button" class="btn btn-ghost" (click)="signOut()">Sign out</button>
  </section>
</main>
