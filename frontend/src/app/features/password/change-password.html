<main class="gate">
  <section class="card form" aria-labelledby="gate-title">
    <div class="brand">
      <img class="brand-mark" src="brand/logo-mark.svg" alt="" width="48" height="48" />
      <div>
        <h1>Vidyasetu</h1>
        <p>{{ i18n.t('app.login.workspace') }}</p>
      </div>
    </div>

    <div>
      <h2 class="card-title" id="gate-title">{{ i18n.t('app.password.title') }}</h2>
      @if (forced()) {
        <p class="info-note" role="status">
          {{ i18n.t('app.password.forced') }}
        </p>
      } @else {
        <p class="hint">{{ i18n.t('app.password.choose') }}</p>
      }
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label class="field">
        {{ i18n.t('app.password.currentLabel') }}
        <input
          class="input"
          type="password"
          formControlName="current_password"
          autocomplete="current-password"
        />
        @if (form.controls.current_password.touched && form.controls.current_password.invalid) {
          <span class="field-error" role="alert">{{ i18n.t('app.password.currentRequired') }}</span>
        }
      </label>

      <label class="field">
        {{ i18n.t('app.password.newLabel') }}
        <input
          class="input"
          type="password"
          formControlName="new_password"
          autocomplete="new-password"
          aria-describedby="new-password-hint"
        />
        <span class="hint" id="new-password-hint">{{ i18n.t('app.password.hint') }}</span>
        @if (
          form.controls.new_password.touched && form.controls.new_password.hasError('required')
        ) {
          <span class="field-error" role="alert">{{ i18n.t('app.password.newRequired') }}</span>
        } @else if (
          form.controls.new_password.touched && form.controls.new_password.hasError('minlength')
        ) {
          <span class="field-error" role="alert">{{
            i18n.t('app.password.minLength', { min: minLength })
          }}</span>
        }
        @if (form.controls.new_password.getError('server'); as message) {
          <span class="field-error" role="alert">{{ message }}</span>
        }
      </label>

      <label class="field">
        {{ i18n.t('app.password.confirmLabel') }}
        <input
          class="input"
          type="password"
          formControlName="confirm"
          autocomplete="new-password"
        />
        @if (form.controls.confirm.touched && form.hasError('mismatch')) {
          <span class="field-error" role="alert">{{ i18n.t('app.password.mismatch') }}</span>
        }
      </label>

      @if (error(); as message) {
        <p class="form-error" role="alert">{{ message }}</p>
      }

      <button type="submit" class="btn btn-primary" [disabled]="submitting()">
        {{ submitting() ? i18n.t('app.password.saving') : i18n.t('app.password.saveContinue') }}
      </button>
    </form>

    <button type="button" class="btn btn-ghost" (click)="signOut()">
      {{ i18n.t('app.shell.signOut') }}
    </button>
  </section>
</main>
