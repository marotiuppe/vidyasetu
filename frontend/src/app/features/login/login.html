<main class="login">
  <form class="card form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="brand">
      <span class="brand-mark"><sms-icon name="book" [size]="26" /></span>
      <div>
        <h1>Rani Laxmibai</h1>
        <p>School workspace</p>
      </div>
    </div>

    <label class="field" for="email">
      Email
      <input class="input" id="email" type="email" formControlName="email" autocomplete="username" />
    </label>
    @if (form.controls.email.touched && form.controls.email.invalid) {
      <p class="field-error" role="alert">Enter a valid email.</p>
    }

    <label class="field" for="password">
      Password
      <input class="input" id="password" type="password" formControlName="password" autocomplete="current-password" />
    </label>
    @if (form.controls.password.touched && form.controls.password.invalid) {
      <p class="field-error" role="alert">Enter your password.</p>
    }

    @if (error(); as message) {
      <p class="form-error" role="alert">{{ message }}</p>
    }

    <button class="btn btn-primary" type="submit" [disabled]="loading()">
      {{ loading() ? 'Signing in…' : 'Sign in' }}
    </button>
  </form>
</main>
