<section id="features" class="section" aria-labelledby="features-title">
  <div class="lp-wrap">
    <div class="head" smsReveal>
      <h2 id="features-title">Everything the school day needs</h2>
      <p>One workspace for the people who run the school and the families who depend on it.</p>
    </div>
    <ul class="grid">
      @for (f of features; track f.title; let i = $index) {
        <li class="card item" [smsReveal]="(i % 3) * 100">
          <span class="chip big" [class]="f.tone"><sms-icon [name]="f.icon" [size]="22" /></span>
          <h3>{{ f.title }}</h3>
          <p>{{ f.text }}</p>
        </li>
      }
    </ul>
  </div>
</section>
