<section class="trust" aria-label="Privacy and access">
  <ul class="lp-wrap trust-list" smsReveal>
    <li>
      <span class="chip"><sms-icon name="shield" [size]="18" /></span>
      <span>Each school's data stays separate</span>
    </li>
    <li>
      <span class="chip tone-sky"><sms-icon name="lock" [size]="18" /></span>
      <span>Role-based access for staff, parents and students</span>
    </li>
  </ul>
</section>

<section class="cta" aria-labelledby="cta-title">
  <div class="lp-wrap band" smsReveal>
    <div>
      <h2 id="cta-title">Ready to open your school workspace?</h2>
      <p>Sign in with the account your school gave you.</p>
    </div>
    <a class="btn btn-lg go" routerLink="/login">Sign in</a>
  </div>
</section>
