<a class="skip" href="#main" (click)="skip($event)">{{ i18n.t('public.skip') }}</a>

<header class="top">
  <div class="lp-wrap top-row">
    <a class="brand" routerLink="/" [attr.aria-label]="i18n.t('public.nav.home')">
      <img src="brand/logo-mark.svg" alt="" width="36" height="36" />
      <span>Vidyasetu</span>
    </a>
    <nav class="links" [attr.aria-label]="i18n.t('public.nav.sections')">
      <a href="#features" (click)="goTo($event, 'features')">{{ i18n.t('public.nav.features') }}</a>
      <a href="#how" (click)="goTo($event, 'how')">{{ i18n.t('public.nav.how') }}</a>
    </nav>
    <a class="btn btn-primary" routerLink="/login">{{ i18n.t('public.action.signIn') }}</a>
  </div>
</header>

<main id="main" #main tabindex="-1">
  <sms-landing-hero />
  <sms-landing-features />
  <sms-landing-steps />
  <sms-landing-cta />
</main>

<footer class="foot">
  <div class="lp-wrap foot-in">
    <span class="foot-brand">
      <img src="brand/logo-mark.svg" alt="" width="28" height="28" />
      <strong>Vidyasetu</strong>
    </span>
    <p>{{ i18n.t('public.footer.tagline') }}</p>
    <small>&copy; {{ year }} Vidyasetu</small>
    <sms-legal-links />
  </div>
</footer>
